version: 2

seeds:
  # ------------------------------------------------------------------------------------
  - name: raw_platforms
    description: >
      Reference list of the six storefronts Jaffle Games publishes on, with the platform
      family and the storefront's revenue-share (fee) rate. Source of truth for fee logic.
    config:
      column_types:
        platform: varchar(20)
        platform_family: varchar(10)
        storefront_fee_rate: number(4,3)
    columns:
      - name: platform
        description: Storefront identifier (steam, playstation, xbox, switch, ios, android).
      - name: platform_family
        description: Grouping of storefronts into pc, console or mobile.
      - name: storefront_fee_rate
        description: Fraction of gross revenue retained by the storefront (e.g. 0.30 = 30%).

  # ------------------------------------------------------------------------------------
  - name: raw_titles
    description: >
      One row per game in the Jaffle Games portfolio. Carries commercial and production
      metadata: monetization model, launch date, list price and whether it is live-service.
    config:
      column_types:
        title_id: varchar(10)
        title_name: varchar(100)
        genre: varchar(40)
        sub_genre: varchar(40)
        monetization_model: varchar(20)
        launch_date: date
        list_price_usd: number(10,2)
        internal_team: varchar(60)
        engine: varchar(30)
        esrb_rating: varchar(6)
        is_live_service: boolean
        sunset_date: date
        _loaded_at: timestamp_ntz
    columns:
      - name: title_id
        description: Surrogate primary key for a title.
      - name: title_name
        description: Player-facing name of the game.
      - name: genre
        description: Primary genre.
      - name: sub_genre
        description: More specific sub-genre.
      - name: monetization_model
        description: "How the title makes money: premium, f2p, or premium_plus_dlc."
      - name: launch_date
        description: Worldwide first-release date of the title.
      - name: list_price_usd
        description: Current premium list price in USD (0 for free-to-play titles).
      - name: internal_team
        description: Studio team that owns the title.
      - name: engine
        description: Game engine the title is built on.
      - name: esrb_rating
        description: ESRB content rating.
      - name: is_live_service
        description: True if the title is operated as an ongoing live-service game.
      - name: sunset_date
        description: >
          Date the title was formally retired, if any. Null for all titles today — whether
          the underperformer should be sunset is a decision this project supports, not a fact.
      - name: _loaded_at
        description: Batch load timestamp from the source extract (UTC).

  # ------------------------------------------------------------------------------------
  - name: raw_title_platforms
    description: One row per title/platform release, with the per-platform launch date and store URL.
    config:
      column_types:
        title_id: varchar(10)
        platform: varchar(20)
        platform_launch_date: date
        store_page_url: varchar(255)
    columns:
      - name: title_id
        description: Foreign key to raw_titles.
      - name: platform
        description: Foreign key to raw_platforms.
      - name: platform_launch_date
        description: Date the title became available on this platform (>= the title launch_date).
      - name: store_page_url
        description: URL of the title's store page on this platform.

  # ------------------------------------------------------------------------------------
  - name: raw_skus
    description: One row per purchasable item (cosmetics, currency packs, battle passes, expansions).
    config:
      column_types:
        sku_id: varchar(10)
        title_id: varchar(10)
        sku_name: varchar(120)
        sku_category: varchar(20)
        price_usd: number(10,2)
        is_active: boolean
        first_available_date: date
    columns:
      - name: sku_id
        description: Surrogate primary key for a purchasable item.
      - name: title_id
        description: Foreign key to raw_titles — the title the SKU belongs to.
      - name: sku_name
        description: Player-facing store name of the item.
      - name: sku_category
        description: "Item type: cosmetic, currency_pack, expansion, or battle_pass."
      - name: price_usd
        description: List price of the item in USD.
      - name: is_active
        description: Whether the SKU is currently sellable in-store.
      - name: first_available_date
        description: Date the SKU first went on sale.

  # ------------------------------------------------------------------------------------
  - name: raw_players
    description: >
      One row per registered player account. Carries acquisition attribution, demographics
      and lifecycle status. Note: acquisition_channel contains a deliberate dirty spelling
      ("Paid Social") that staging normalizes.
    config:
      column_types:
        player_id: varchar(10)
        registered_at: timestamp_ntz
        country_code: varchar(10)
        platform_registered_on: varchar(20)
        acquisition_channel: varchar(40)
        acquisition_campaign_id: varchar(10)
        birth_year: integer
        email: varchar(255)
        marketing_opt_in: boolean
        account_status: varchar(20)
        last_login_at: timestamp_ntz
        _loaded_at: timestamp_ntz
    columns:
      - name: player_id
        description: Surrogate primary key for a player account.
      - name: registered_at
        description: Account registration timestamp (UTC).
      - name: country_code
        description: ISO-3166 alpha-2 country of the account (raw; may be uppercased/padded).
      - name: platform_registered_on
        description: Storefront the account first registered on.
      - name: acquisition_channel
        description: >
          Marketing channel that acquired the player (organic, paid_social, influencer,
          store_featured, cross_promo). Contains a deliberate variant spelling.
      - name: acquisition_campaign_id
        description: Foreign key to raw_marketing_spend.campaign_id, when acquired via a paid campaign.
      - name: birth_year
        description: Self-reported birth year, used to derive age bands.
      - name: email
        description: Account email (synthetic example.com addresses).
      - name: marketing_opt_in
        description: Whether the player consented to marketing contact.
      - name: account_status
        description: "Current account state: active, dormant, churned, or banned."
      - name: last_login_at
        description: Timestamp of the player's most recent login (UTC).
      - name: _loaded_at
        description: Batch load timestamp from the source extract (UTC).

  # ------------------------------------------------------------------------------------
  - name: raw_releases
    description: >
      One row per patch or content drop, across all titles, with planned-vs-actual dev days
      and QA bug counts. Three flagship releases are engineered to matter (see docs/demo-notes.md).
    config:
      column_types:
        release_id: varchar(10)
        title_id: varchar(10)
        app_version: varchar(20)
        released_at: timestamp_ntz
        release_type: varchar(20)
        release_notes: varchar(500)
        dev_days_estimated: integer
        dev_days_actual: integer
        qa_bug_count: integer
        is_rollback: boolean
        _loaded_at: timestamp_ntz
    columns:
      - name: release_id
        description: Surrogate primary key for a release.
      - name: title_id
        description: Foreign key to raw_titles.
      - name: app_version
        description: Semantic version string shipped by this release.
      - name: released_at
        description: Release timestamp (UTC).
      - name: release_type
        description: "One of major, minor, hotfix, content_drop, event."
      - name: release_notes
        description: Short human-readable summary of the release.
      - name: dev_days_estimated
        description: Estimated engineering days budgeted for the release.
      - name: dev_days_actual
        description: Actual engineering days spent.
      - name: qa_bug_count
        description: Number of QA-logged bugs associated with the release.
      - name: is_rollback
        description: True if this release rolled back a prior one.
      - name: _loaded_at
        description: Batch load timestamp from the source extract (UTC).

  # ------------------------------------------------------------------------------------
  - name: raw_play_sessions
    description: >
      One row per play session (event grain). The largest fact seed. Contains deliberate
      data-quality issues: 3 duplicate session_id rows, ~15 dirty country_code values,
      4 sessions with a null end (crash), and 2 idle-session duration outliers.
    config:
      column_types:
        session_id: varchar(10)
        player_id: varchar(10)
        title_id: varchar(10)
        platform: varchar(20)
        session_start_at: timestamp_ntz
        session_end_at: timestamp_ntz
        duration_seconds: integer
        device_model: varchar(40)
        app_version: varchar(20)
        country_code: varchar(10)
        levels_completed: integer
        crashed_flag: boolean
        network_type: varchar(20)
        _loaded_at: timestamp_ntz
    columns:
      - name: session_id
        description: Session identifier. NOT unique in raw — 3 duplicate rows exist by design.
      - name: player_id
        description: Foreign key to raw_players.
      - name: title_id
        description: Foreign key to raw_titles.
      - name: platform
        description: Foreign key to raw_platforms — storefront the session ran on.
      - name: session_start_at
        description: Session start timestamp (UTC).
      - name: session_end_at
        description: Session end timestamp (UTC). Null when the client crashed before closing.
      - name: duration_seconds
        description: Session length in seconds. Null when end is null; two idle outliers exist.
      - name: device_model
        description: Device or hardware model string.
      - name: app_version
        description: Client version the session ran on.
      - name: country_code
        description: Country the session originated from (raw; contains dirty values).
      - name: levels_completed
        description: Number of levels/matches completed in the session.
      - name: crashed_flag
        description: True if the client reported a crash during the session.
      - name: network_type
        description: Network the session used (wifi, cellular, ethernet).
      - name: _loaded_at
        description: Batch load timestamp from the source extract (UTC).

  # ------------------------------------------------------------------------------------
  - name: raw_transactions
    description: >
      One row per monetary transaction. IMPORTANT: transaction_at arrives in America/New_York
      wall-clock time (every other seed is UTC) and refunds/chargebacks are stored as POSITIVE
      amounts distinguished only by transaction_type. Staging fixes both.
    config:
      column_types:
        transaction_id: varchar(10)
        player_id: varchar(10)
        title_id: varchar(10)
        platform: varchar(20)
        transaction_at: timestamp_ntz
        transaction_type: varchar(20)
        sku_id: varchar(10)
        gross_amount_usd: number(12,2)
        platform_fee_usd: number(12,2)
        currency_code: varchar(3)
        local_amount: number(14,2)
        payment_method: varchar(20)
        is_first_purchase: boolean
        _loaded_at: timestamp_ntz
    columns:
      - name: transaction_id
        description: Surrogate primary key for a transaction.
      - name: player_id
        description: Foreign key to raw_players.
      - name: title_id
        description: Foreign key to raw_titles.
      - name: platform
        description: Foreign key to raw_platforms — storefront the transaction cleared on.
      - name: transaction_at
        description: Transaction timestamp in America/New_York wall-clock (converted to UTC in staging).
      - name: transaction_type
        description: "premium_purchase, iap, season_pass, dlc, refund, or chargeback."
      - name: sku_id
        description: Foreign key to raw_skus. Null for premium_purchase (base-game) rows.
      - name: gross_amount_usd
        description: Gross transaction amount in USD, always positive (sign handled downstream).
      - name: platform_fee_usd
        description: Storefront fee withheld on the transaction, in USD.
      - name: currency_code
        description: ISO currency the player was charged in.
      - name: local_amount
        description: Transaction amount in the player's local currency.
      - name: payment_method
        description: Payment instrument used (card, paypal, apple_pay, google_play, platform_wallet).
      - name: is_first_purchase
        description: True if this is the player's first acquisition transaction.
      - name: _loaded_at
        description: Batch load timestamp from the source extract (UTC).

  # ------------------------------------------------------------------------------------
  - name: raw_high_scores
    description: One row per leaderboard submission, including cheat flags for anti-cheat handling.
    config:
      column_types:
        score_id: varchar(10)
        player_id: varchar(10)
        title_id: varchar(10)
        leaderboard_id: varchar(40)
        score_value: number(38,0)
        submitted_at: timestamp_ntz
        is_verified: boolean
        flagged_for_cheating: boolean
        _loaded_at: timestamp_ntz
    columns:
      - name: score_id
        description: Surrogate primary key for a leaderboard submission.
      - name: player_id
        description: Foreign key to raw_players.
      - name: title_id
        description: Foreign key to raw_titles.
      - name: leaderboard_id
        description: Identifier of the leaderboard the score was submitted to.
      - name: score_value
        description: Raw submitted score.
      - name: submitted_at
        description: Submission timestamp (UTC).
      - name: is_verified
        description: Whether the score passed server-side verification.
      - name: flagged_for_cheating
        description: Whether anti-cheat flagged the submission as suspicious.
      - name: _loaded_at
        description: Batch load timestamp from the source extract (UTC).

  # ------------------------------------------------------------------------------------
  - name: raw_reviews
    description: One row per store review, with rating, recommendation and playtime at time of review.
    config:
      column_types:
        review_id: varchar(10)
        player_id: varchar(10)
        title_id: varchar(10)
        platform: varchar(20)
        rating: integer
        review_text_length: integer
        reviewed_at: timestamp_ntz
        is_recommended: boolean
        playtime_at_review_hours: number(6,1)
    columns:
      - name: review_id
        description: Surrogate primary key for a review.
      - name: player_id
        description: Foreign key to raw_players.
      - name: title_id
        description: Foreign key to raw_titles.
      - name: platform
        description: Storefront the review was left on.
      - name: rating
        description: Star rating, 1 to 5.
      - name: review_text_length
        description: Character length of the review body.
      - name: reviewed_at
        description: Review timestamp (UTC).
      - name: is_recommended
        description: Whether the reviewer recommended the title.
      - name: playtime_at_review_hours
        description: Hours the reviewer had played when they left the review.

  # ------------------------------------------------------------------------------------
  - name: raw_marketing_spend
    description: One row per campaign-week, with spend and the impression/click/install funnel.
    config:
      column_types:
        campaign_id: varchar(10)
        title_id: varchar(10)
        channel: varchar(40)
        week_start_date: date
        spend_usd: number(12,2)
        impressions: integer
        clicks: integer
        installs: integer
    columns:
      - name: campaign_id
        description: Identifier of the marketing campaign.
      - name: title_id
        description: Foreign key to raw_titles — the title being promoted.
      - name: channel
        description: Acquisition channel of the campaign (paid_social, influencer, store_featured, cross_promo).
      - name: week_start_date
        description: Monday-anchored start of the spend week.
      - name: spend_usd
        description: Media spend for the campaign-week in USD.
      - name: impressions
        description: Ad impressions served.
      - name: clicks
        description: Ad clicks received.
      - name: installs
        description: Attributed installs from the campaign-week.
