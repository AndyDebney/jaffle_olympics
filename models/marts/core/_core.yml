version: 2

models:
  # ====================================================================================
  # DIMENSIONS
  # ====================================================================================
  - name: dim_platforms
    description: Conformed platform dimension — one row per storefront, with fee economics.

    columns:
      - name: platform_id
        description: Storefront identifier (primary key).
        data_type: varchar
        data_tests: [unique, not_null]
      - name: platform_family
        description: Whether the storefront is pc, console or mobile — the level most portfolio cuts use.
        data_type: varchar
      - name: storefront_fee_rate
        description: Share of gross revenue the storefront keeps; the lever behind studio net revenue.
        data_type: number(4,3)

  # ------------------------------------------------------------------------------------
  - name: dim_skus
    description: Conformed SKU dimension — one row per purchasable item, with its title.
    config:
      contract:
        enforced: true
    columns:
      - name: sku_id
        description: SKU identifier (primary key).
        data_type: varchar
        constraints: [type: not_null]
        data_tests: [unique, not_null]
      - name: title_id
        description: Title the SKU belongs to.
        data_type: varchar
        data_tests:
          - relationships:
              arguments: {to: ref('dim_titles'), field: title_id}
      - name: title_name
        description: Name of the title the SKU belongs to, denormalized for convenience.
        data_type: varchar
      - name: sku_name
        description: Player-facing store name of the item.
        data_type: varchar
      - name: sku_category
        description: Item type — cosmetic, currency_pack, expansion or battle_pass.
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['cosmetic', 'currency_pack', 'expansion', 'battle_pass']

      - name: price_usd
        description: Current list price of the item in USD.
        data_type: number(12,2)
      - name: is_active
        description: Whether the item is currently sellable.
        data_type: boolean
      - name: first_available_date
        description: Date the item first went on sale.
        data_type: date
      - name: legacy_sku_id
        description: Pre-migration storefront id for the item, kept for joins against older transactions.
        data_type: varchar

  # ------------------------------------------------------------------------------------
  - name: dim_dates
    description: >
      Date spine covering the history window plus 90 days forward. Lets time-series marts
      show months and weeks with zero activity instead of dropping them.
    config:
      contract:
        enforced: true
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: Calendar day (primary key).
        data_type: date
        constraints: [type: not_null]
        data_tests: [unique, not_null]
        granularity: day
      - name: year_number
        description: Calendar year.
        data_type: integer
      - name: quarter_number
        description: Calendar quarter (1-4).
        data_type: integer
      - name: month_number
        description: Calendar month (1-12).
        data_type: integer
      - name: month_name
        description: Full month name.
        data_type: varchar
      - name: day_of_month
        description: Day of the month (1-31).
        data_type: integer
      - name: day_of_week_iso
        description: ISO day of week (1 = Monday … 7 = Sunday).
        data_type: integer
      - name: day_name
        description: Full weekday name.
        data_type: varchar
      - name: is_weekend
        description: True for Saturday and Sunday — used for the weekend engagement lift.
        data_type: boolean
      - name: week_start_date
        description: Monday-anchored start of the week.
        data_type: date
      - name: month_start_date
        description: First day of the month.
        data_type: date
      - name: quarter_start_date
        description: First day of the quarter.
        data_type: date
      - name: is_within_history_window
        description: True when the day falls inside the seeded 12-month history window.
        data_type: boolean

  # ------------------------------------------------------------------------------------
  - name: dim_titles
    description: >
      Conformed title dimension with derived lifecycle stage. Lifecycle blends title age with
      recent engagement so leadership can see, at a glance, which titles are in launch, growth,
      mature, declining, or sunset_candidate states.
    config:
      contract:
        enforced: true
    columns:
      - name: title_id
        description: Title identifier (primary key).
        data_type: varchar
        constraints: [type: not_null]
        data_tests: [unique, not_null]
      - name: title_name
        description: Player-facing title name.
        data_type: varchar
        data_tests: [not_null]
      - name: genre
        description: Primary genre of the title.
        data_type: varchar
      - name: sub_genre
        description: More specific sub-genre.
        data_type: varchar
      - name: monetization_model
        description: How the title earns — premium, f2p, or premium_plus_dlc.
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['premium', 'f2p', 'premium_plus_dlc']

      - name: is_live_service
        description: Whether the title is operated as an ongoing live-service game.
        data_type: boolean
      - name: launch_date
        description: Worldwide launch date.
        data_type: date
      - name: list_price_usd
        description: Current premium list price (0 for free-to-play).
        data_type: number(12,2)
      - name: internal_team
        description: Studio team that owns the title.
        data_type: varchar
      - name: engine
        description: Game engine the title runs on.
        data_type: varchar
      - name: esrb_rating
        description: ESRB content rating.
        data_type: varchar
      - name: sunset_date
        description: Date the title was formally retired, if ever. Null for all live titles.
        data_type: date
      - name: days_since_launch
        description: Days between launch and the analysis date — the age axis for lifecycle.
        data_type: integer
      - name: platform_count
        description: Number of storefronts the title is released on.
        data_type: integer
      - name: earliest_platform_launch_date
        description: Earliest per-platform launch date on record.
        data_type: date
      - name: lifecycle_stage
        description: >
          Derived stage: launch_window (<=90 days old), growth, mature, declining, or
          sunset_candidate (aged with no play in 60+ days). Drives investment conversations.
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['launch_window', 'growth', 'mature', 'declining', 'sunset_candidate']

      - name: lifetime_sessions
        description: All sessions ever recorded for the title in the history window.
        data_type: integer
      - name: lifetime_players
        description: Distinct players who ever played the title.
        data_type: integer
      - name: first_session_at
        description: Timestamp of the earliest recorded session.
        data_type: timestamp_ntz
      - name: last_session_at
        description: Timestamp of the most recent recorded session — the recency signal for sunset.
        data_type: timestamp_ntz
      - name: days_since_last_session
        description: Days since the title was last played, as of the analysis date.
        data_type: integer
      - name: sessions_last_60d
        description: Sessions in the trailing 60 days — near-zero flags a stalling title.
        data_type: integer
      - name: active_players_last_90d
        description: Distinct players active in the trailing 90 days.
        data_type: integer
      - name: avg_review_rating
        description: Average store rating (1-5) across all reviews of the title.
        data_type: number(4,2)
      - name: review_count
        description: Number of store reviews on record.
        data_type: integer
      - name: recommend_rate
        description: Share of reviews that recommend the title (0-1).
        data_type: number(5,4)

  # ------------------------------------------------------------------------------------
  - name: dim_players
    description: >
      Conformed player dimension. One row per registered account with acquisition, lifecycle,
      engagement and monetization attributes. payer_segment reflects live-service spend only;
      is_churned is behavioural (session recency), distinct from the source account_status.
    config:
      contract:
        enforced: true
    columns:
      - name: player_id
        description: Player identifier (primary key).
        data_type: varchar
        constraints: [type: not_null]
        data_tests: [unique, not_null]
      - name: registered_at
        description: Account registration timestamp (UTC).
        data_type: timestamp_ntz
        data_tests: [not_null]
      - name: registration_cohort_month
        description: Month the player registered — the cohort key for retention analysis.
        data_type: date
      - name: country_code
        description: Cleaned ISO country code of the account.
        data_type: varchar
      - name: platform_registered_on_id
        description: Storefront the account first registered on.
        data_type: varchar
      - name: acquisition_channel
        description: Normalized channel that acquired the player — the axis for CAC and retention-by-channel.
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['organic', 'paid_social', 'influencer', 'store_featured', 'cross_promo']
      - name: acquisition_campaign_id
        description: Paid campaign that acquired the player, if any.
        data_type: varchar
      - name: birth_year
        description: Self-reported birth year.
        data_type: integer
      - name: age_years
        description: Player age as of the analysis date, derived from birth_year.
        data_type: integer
      - name: marketing_opt_in
        description: Whether the player consented to marketing contact.
        data_type: boolean
      - name: account_status
        description: Source-system account state — active, dormant, churned or banned.
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['active', 'dormant', 'churned', 'banned']
      - name: last_login_at
        description: Most recent login timestamp (UTC).
        data_type: timestamp_ntz
      - name: lifetime_sessions
        description: Total sessions the player has played.
        data_type: integer
      - name: lifetime_valid_sessions
        description: Sessions excluding crashes and idle outliers — the denominator for clean engagement.
        data_type: integer
      - name: lifetime_play_minutes
        description: Total valid play time in minutes.
        data_type: number(12,2)
      - name: distinct_titles_played
        description: Number of distinct titles the player has played.
        data_type: integer
      - name: first_session_at
        description: Timestamp of the player's first session.
        data_type: timestamp_ntz
      - name: last_session_at
        description: Timestamp of the player's most recent session.
        data_type: timestamp_ntz
      - name: days_since_last_session
        description: Days since the player last played, as of the analysis date.
        data_type: integer
      - name: favorite_title_id
        description: Title the player has played most (by session count).
        data_type: varchar
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_titles')
                field: title_id
              config: {where: "favorite_title_id is not null"}
      - name: favorite_title_name
        description: Name of the player's most-played title.
        data_type: varchar
      - name: primary_platform_id
        description: Storefront the player uses most.
        data_type: varchar
      - name: live_service_net_usd
        description: Lifetime live-service spend (iap + season_pass, net of reversals) — the basis for payer_segment.
        data_type: number(12,2)
      - name: lifetime_net_revenue_usd
        description: Lifetime net revenue from the player across all streams (premium, iap, season, dlc, less reversals).
        data_type: number(12,2)
      - name: lifetime_studio_net_usd
        description: Lifetime revenue net of storefront fees — what the studio actually keeps.
        data_type: number(12,2)
      - name: payer_segment
        description: >
          Live-service payer tier — whale, dolphin, minnow or non_payer — from lifetime iap +
          season_pass spend. A non_payer may still have bought a premium title or DLC.
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['whale', 'dolphin', 'minnow', 'non_payer']

      - name: is_payer
        description: True if the player has any lifetime live-service spend.
        data_type: boolean
      - name: first_purchase_at
        description: Timestamp of the player's first acquisition transaction, if any.
        data_type: timestamp_ntz
      - name: is_churned
        description: >
          Behavioural churn flag — true when the player's last session is older than the
          churn threshold ({{ var('churn_days_threshold') }} days) as of the analysis date.
        data_type: boolean

  # ====================================================================================
  # FACTS
  # ====================================================================================
  - name: fct_play_sessions
    description: >
      One row per play session. The central engagement fact: duration, validity, the release
      in effect at session time, and the week offset from registration for retention.
      Engagement semantic model over the session fact.
    config:
      contract:
        enforced: true
    columns:
      - name: session_id
        description: Session identifier (primary key; deduplicated upstream).
        data_type: varchar
        constraints: [type: not_null]
        data_tests: [unique, not_null]
        entity:
          type: primary
          name: session
      - name: player_id
        description: Player who played the session.
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_players'), field: player_id}
        entity:
          type: foreign
          name: player
      - name: title_id
        description: Title played.
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_titles'), field: title_id}
        entity:
          type: foreign
          name: title
      - name: platform_id
        description: Storefront the session ran on.
        data_type: varchar
        data_tests:
          - not_null
        entity:
          type: foreign
          name: platform
      - name: release_id_in_effect
        description: The release live for this title at session start (null if before any release).
        data_type: varchar
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_releases')
                field: release_id
              config: {where: "release_id_in_effect is not null"}

      - name: session_start_at
        description: Session start (UTC).
        data_type: timestamp_ntz
        data_tests: [not_null]
      - name: session_end_at
        description: Session end (UTC). Null when the client crashed before closing.
        data_type: timestamp_ntz
      - name: session_date
        description: Calendar date of the session start.
        data_type: date
        dimension:
          type: time
          name: session_day
        granularity: day
      - name: session_month
        description: Month of the session — the grain for monthly engagement marts.
        data_type: date
      - name: session_week
        description: Week of the session (Monday-anchored).
        data_type: date
      - name: duration_seconds
        description: Raw session length in seconds (null for crash sessions).
        data_type: integer
      - name: session_duration_minutes
        description: Session length in minutes.
        data_type: number(12,2)
      - name: is_valid_session
        description: True for clean sessions used in engagement metrics — excludes crashes and idle outliers.
        data_type: boolean
        dimension:
          type: categorical
      - name: levels_completed
        description: Levels or matches completed in the session.
        data_type: integer
      - name: crashed_flag
        description: True if the client reported a crash.
        data_type: boolean
      - name: network_type
        description: Network used — wifi, cellular or ethernet.
        data_type: varchar
        dimension:
          type: categorical
      - name: device_model
        description: Device or hardware model.
        data_type: varchar
      - name: app_version
        description: Client version reported by the session.
        data_type: varchar
      - name: release_version_in_effect
        description: Semantic version of the release in effect at session time.
        data_type: varchar
      - name: country_code
        description: Cleaned country the session originated from.
        data_type: varchar
      - name: registration_cohort_month
        description: Registration cohort month of the player — carried for cohort-sliced engagement.
        data_type: date
        dimension:
          type: time
        granularity: month
      - name: week_offset_from_registration
        description: Whole weeks between registration and the session (0 = registration week).
        data_type: integer
        dimension:
          type: categorical
      - name: is_weekend_session
        description: True when the session started on a Saturday or Sunday.
        data_type: boolean
    semantic_model:
      enabled: true
      name: fct_play_sessions
    agg_time_dimension: session_day
    metrics:
      - name: monthly_active_players
        label: Monthly active players
        description: Distinct players active in a period (query at the month grain for MAP).
        type: simple
        agg: count_distinct
        expr: player_id
      - name: cohort_players
        label: Cohort players
        description: Distinct players (the retention denominator).
        type: simple
        agg: count_distinct
        expr: player_id
      - name: week4_returned_players
        label: Week-4 returned players
        description: Distinct players active in their fourth week after registration.
        type: simple
        filter: "{{ Dimension('session__week_offset_from_registration') }} = 4"
        agg: count_distinct
        expr: player_id
      - name: session_count
        description: Number of play sessions.
        agg: count
        expr: session_id
        type: simple
        hidden: true
      - name: valid_session_count
        description: Sessions excluding crashes and idle outliers.
        agg: sum
        expr: "case when is_valid_session then 1 else 0 end"
        type: simple
        hidden: true
      - name: play_minutes
        description: Total valid play minutes.
        agg: sum
        expr: session_duration_minutes
        type: simple
        hidden: true
      - name: week_4_retention
        label: Week-4 retention
        description: Players active in week 4 after registration over all players.
        type: ratio
        numerator: week4_returned_players
        denominator: cohort_players

  # ------------------------------------------------------------------------------------
  - name: fct_transactions
    description: >-
      One row per transaction with signed net amounts and studio net revenue. Refunds and
      chargebacks are negative here (they arrive positive in source). transaction_at is UTC.
      Monetization semantic model over the transaction fact.
    config:
      contract:
        enforced: true
    columns:
      - name: transaction_id
        description: Transaction identifier (primary key).
        data_type: varchar
        constraints: [type: not_null]
        data_tests: [unique, not_null]
        entity:
          type: primary
          name: transaction
      - name: player_id
        description: Player who transacted.
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_players'), field: player_id}
        entity:
          type: foreign
          name: player
      - name: title_id
        description: Title the transaction is attributed to.
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_titles'), field: title_id}
        entity:
          type: foreign
          name: title
      - name: platform_id
        description: Storefront the transaction cleared on.
        data_type: varchar
        data_tests:
          - not_null
        entity:
          type: foreign
          name: platform
      - name: sku_id
        description: SKU purchased; null for premium (base-game) purchases.
        data_type: varchar
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_skus')
                field: sku_id
              config: {where: "sku_id is not null"}
      - name: transaction_at
        description: Transaction timestamp in UTC (converted from America/New_York).
        data_type: timestamp_ntz
        data_tests: [not_null]
      - name: transaction_at_local
        description: Original transaction timestamp in America/New_York wall-clock, kept for audit.
        data_type: timestamp_ntz
      - name: transaction_date
        description: Calendar date of the transaction (UTC).
        data_type: date
        dimension:
          type: time
          name: transaction_day
        granularity: day
      - name: transaction_month
        description: Month of the transaction — the grain for monthly revenue marts.
        data_type: date
      - name: transaction_type
        description: premium_purchase, iap, season_pass, dlc, refund or chargeback.
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['premium_purchase', 'iap', 'season_pass', 'dlc', 'refund', 'chargeback']
        dimension:
          type: categorical
      - name: revenue_stream_group
        description: Grouped stream — live_service, catalog or reversal — for stream-level finance cuts.
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['live_service', 'catalog', 'reversal']
        dimension:
          type: categorical

      - name: is_live_service_revenue
        description: True for iap/season_pass and their reversals — the live-service revenue base.
        data_type: boolean
      - name: is_first_purchase
        description: True if this is the player's first acquisition transaction.
        data_type: boolean
      - name: currency_code
        description: Currency the player was charged in.
        data_type: varchar
      - name: payment_method
        description: Payment instrument used.
        data_type: varchar
      - name: gross_amount_usd
        description: Gross amount in USD, positive for sales.
        data_type: number(12,2)
      - name: platform_fee_usd
        description: Storefront fee withheld on the transaction.
        data_type: number(12,2)
      - name: net_amount_usd
        description: Signed net amount — negative for refunds and chargebacks.
        data_type: number(12,2)
      - name: studio_net_revenue_usd
        description: Signed revenue net of storefront fees — the studio's recognized take.
        data_type: number(12,2)
    semantic_model:
      enabled: true
      name: fct_transactions
    agg_time_dimension: transaction_day
    metrics:
      - name: net_revenue
        label: Net revenue (USD)
        description: Net revenue across all streams, refunds and chargebacks netted out.
        type: simple
        agg: sum
        expr: net_amount_usd
      - name: paying_players
        label: Paying players
        description: Distinct players with positive net spend.
        type: simple
        agg: count_distinct
        expr: "case when net_amount_usd > 0 then player_id end"
      - name: studio_net_revenue
        description: Net revenue after storefront fees.
        agg: sum
        expr: studio_net_revenue_usd
        type: simple
        hidden: true
      - name: gross_revenue
        description: Gross transaction amount in USD.
        agg: sum
        expr: gross_amount_usd
        type: simple
        hidden: true
      - name: arppu
        label: ARPPU (USD)
        description: Average net revenue per paying player.
        type: ratio
        numerator: net_revenue
        denominator: paying_players
  - name: fct_high_scores
    description: >
      One row per leaderboard submission. Cheat-flagged submissions are retained and counted
      but excluded from ranking; leaderboard_rank and score_percentile cover legit rows only.
    config:
      contract:
        enforced: true
    columns:
      - name: score_id
        description: Submission identifier (primary key).
        data_type: varchar
        constraints: [type: not_null]
        data_tests: [unique, not_null]
      - name: player_id
        description: Player who submitted the score.
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_players'), field: player_id}
      - name: title_id
        description: Title the leaderboard belongs to.
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_titles'), field: title_id}
      - name: leaderboard_id
        description: Leaderboard the score was submitted to.
        data_type: varchar
      - name: score_value
        description: Raw submitted score.
        data_type: number(38,0)
      - name: submitted_at
        description: Submission timestamp (UTC).
        data_type: timestamp_ntz
      - name: submitted_date
        description: Calendar date of the submission.
        data_type: date
      - name: is_verified
        description: Whether the score passed server-side verification.
        data_type: boolean
      - name: flagged_for_cheating
        description: Whether anti-cheat flagged the submission as suspicious.
        data_type: boolean
      - name: leaderboard_rank
        description: Rank within the leaderboard among legit submissions (null for flagged rows).
        data_type: integer
      - name: score_percentile
        description: Percentile of the score among legit submissions on the leaderboard (0-1).
        data_type: number(6,4)

  # ------------------------------------------------------------------------------------
  - name: fct_releases
    description: >
      One row per release with development variance and a matched 10-day before/after
      engagement delta (sessions, active players, crash rate, session length). Powers the
      live-ops "did this release help or hurt?" question.
    config:
      contract:
        enforced: true
    columns:
      - name: release_id
        description: Release identifier (primary key).
        data_type: varchar
        constraints: [type: not_null]
        data_tests: [unique, not_null]
      - name: title_id
        description: Title the release shipped for.
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_titles'), field: title_id}
      - name: app_version
        description: Semantic version shipped.
        data_type: varchar
      - name: released_at
        description: Release timestamp (UTC).
        data_type: timestamp_ntz
      - name: released_date
        description: Calendar date of the release.
        data_type: date
      - name: release_type
        description: major, minor, hotfix, content_drop or event.
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['major', 'minor', 'hotfix', 'content_drop', 'event']

      - name: is_rollback
        description: True if the release rolled back a prior one.
        data_type: boolean
      - name: dev_days_estimated
        description: Engineering days budgeted.
        data_type: integer
      - name: dev_days_actual
        description: Engineering days actually spent.
        data_type: integer
      - name: dev_days_variance
        description: Actual minus estimated dev days — positive means over budget.
        data_type: integer
      - name: dev_days_variance_pct
        description: Dev-day variance as a fraction of the estimate.
        data_type: number(9,4)
      - name: is_over_budget
        description: True when the release took longer than estimated.
        data_type: boolean
      - name: qa_bug_count
        description: QA-logged bugs associated with the release.
        data_type: integer
      - name: sessions_10d_before
        description: Sessions for the title in the 10 days before release.
        data_type: integer
      - name: sessions_10d_after
        description: Sessions for the title in the 10 days after release.
        data_type: integer
      - name: session_count_delta
        description: After-minus-before session count — the headline engagement swing.
        data_type: integer
      - name: active_players_10d_before
        description: Distinct active players in the 10 days before release.
        data_type: integer
      - name: active_players_10d_after
        description: Distinct active players in the 10 days after release.
        data_type: integer
      - name: crash_rate_10d_before
        description: Share of sessions that crashed in the 10 days before release.
        data_type: number(6,4)
      - name: crash_rate_10d_after
        description: Share of sessions that crashed in the 10 days after release — spikes flag bad builds.
        data_type: number(6,4)
      - name: avg_minutes_10d_before
        description: Average valid session length (minutes) in the 10 days before release.
        data_type: number(12,2)
      - name: avg_minutes_10d_after
        description: Average valid session length (minutes) in the 10 days after release.
        data_type: number(12,2)
      - name: made_engagement_worse
        description: >
          True when the release cut sessions or raised the crash rate by more than 5 points —
          the flag that surfaces regressions like the engineered Engine 5 major.
        data_type: boolean

unit_tests:
  - name: test_fct_high_scores_excludes_flagged_cheaters_from_rank
    description: >
      Cheat-flagged submissions are retained in the output but excluded from
      leaderboard_rank/score_percentile — ranks and percentiles are computed only among
      legitimate rows on each leaderboard.
    model: fct_high_scores
    given:
      - input: ref('stg_high_scores')
        rows:
          - {score_id: s1, player_id: p1, title_id: t1, leaderboard_id: lb1, score_value: 100, submitted_at: "2026-01-01 00:00:00", is_verified: true, flagged_for_cheating: false}
          - {score_id: s2, player_id: p2, title_id: t1, leaderboard_id: lb1, score_value: 90, submitted_at: "2026-01-01 00:00:00", is_verified: true, flagged_for_cheating: false}
          - {score_id: s3, player_id: p3, title_id: t1, leaderboard_id: lb1, score_value: 200, submitted_at: "2026-01-01 00:00:00", is_verified: true, flagged_for_cheating: true}
          - {score_id: s4, player_id: p4, title_id: t1, leaderboard_id: lb1, score_value: 80, submitted_at: "2026-01-01 00:00:00", is_verified: true, flagged_for_cheating: false}
    expect:
      rows:
        - {score_id: s1, leaderboard_rank: 1, score_percentile: 1.0}
        - {score_id: s2, leaderboard_rank: 2, score_percentile: 0.5}
        - {score_id: s3, leaderboard_rank: null, score_percentile: null}
        - {score_id: s4, leaderboard_rank: 3, score_percentile: 0.0}