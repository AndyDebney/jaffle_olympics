version: 2

models:
  - name: mart_live_ops_health
    description: >
      Release health for live ops: matched 10-day before/after windows for engagement, crash
      rate, session length and net revenue per active player, plus engineering execution and a
      regressed_release flag. Surfaces the engineered bad major and its rollback.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [release_id]
    columns:
      - name: release_id
        description: Release summarized.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments: { to: ref('fct_releases'), field: release_id }
      - name: title_id
        description: Title the release shipped for.
        data_tests:
          - relationships:
              arguments: { to: ref('dim_titles'), field: title_id }
      - name: title_name
        description: Player-facing title name.
      - name: lifecycle_stage
        description: Title's lifecycle stage, for context.
      - name: app_version
        description: Semantic version shipped.
      - name: released_date
        description: Release date.
      - name: release_type
        description: major, minor, hotfix, content_drop or event.
      - name: is_rollback
        description: True if the release rolled back a prior one.
      - name: dev_days_estimated
        description: Engineering days budgeted.
      - name: dev_days_actual
        description: Engineering days spent.
      - name: dev_days_variance
        description: Actual minus estimated dev days.
      - name: dev_days_variance_pct
        description: Dev-day variance as a fraction of the estimate.
      - name: is_over_budget
        description: True when the release took longer than estimated.
      - name: qa_bug_count
        description: QA-logged bugs for the release.
      - name: sessions_10d_before
        description: Sessions in the 10 days before release.
      - name: sessions_10d_after
        description: Sessions in the 10 days after release.
      - name: session_count_delta
        description: After-minus-before session count.
      - name: active_players_10d_before
        description: Active players in the 10 days before release.
      - name: active_players_10d_after
        description: Active players in the 10 days after release.
      - name: active_players_delta
        description: After-minus-before active players.
      - name: avg_minutes_10d_before
        description: Average valid session length before release (minutes).
      - name: avg_minutes_10d_after
        description: Average valid session length after release (minutes).
      - name: avg_minutes_delta
        description: Change in average session length across the release.
      - name: crash_rate_10d_before
        description: Crash rate before release (0-1).
      - name: crash_rate_10d_after
        description: Crash rate after release (0-1).
      - name: crash_rate_delta
        description: Change in crash rate across the release — the bad-build signal.
      - name: net_revenue_10d_before
        description: Net revenue in the 10 days before release.
      - name: net_revenue_10d_after
        description: Net revenue in the 10 days after release.
      - name: net_rev_per_active_before
        description: Net revenue per active player before release.
      - name: net_rev_per_active_after
        description: Net revenue per active player after release.
      - name: made_engagement_worse
        description: True when sessions fell or crash rate rose materially after release.
      - name: regressed_release
        description: >
          Overall regression flag — engagement down, crash rate above 15%, or a >30% dev-day
          overrun. The one column to sort by to find bad releases.
