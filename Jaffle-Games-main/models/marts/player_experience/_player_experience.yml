version: 2

models:
  - name: mart_player_retention
    description: >
      Cohort retention triangle at registration-cohort x acquisition-channel x week-offset.
      Cohort size is on every row so rates are always read against their (small) denominator,
      and is_observable marks cells whose week has not yet fully elapsed. Serves player
      experience (where cohorts drop off) and the organic-vs-paid_social quality story.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [registration_cohort_month, acquisition_channel, week_offset]
    columns:
      - name: registration_cohort_month
        description: Month the cohort registered.
        data_tests: [not_null]
      - name: acquisition_channel
        description: Acquisition channel slice of the cohort.
        data_tests:
          - accepted_values:
              arguments:
                values: ['organic', 'paid_social', 'influencer', 'store_featured', 'cross_promo']
      - name: week_offset
        description: Whole weeks since registration (0 = registration week).
        data_tests: [not_null]
      - name: cohort_size
        description: Number of players in the cohort/channel — the denominator for every rate on the row.
      - name: retained_players
        description: Distinct players from the cohort/channel active in this week offset.
      - name: is_observable
        description: >
          True when the week has fully elapsed as of the analysis date. When false the cell is
          not yet measurable and retention_rate is null (late cohorts are not treated as churn).
      - name: retention_rate
        description: Retained players over cohort size (0-1); null when the cell is not observable.

  - name: mart_player_leaderboard
    description: >
      Cross-title player standings: each player's best legitimate score per leaderboard, with
      rank and percentile within the leaderboard and globally. Cheat-flagged submissions are
      excluded from standings but counted in flagged_submissions for anti-cheat visibility.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [player_id, leaderboard_id]
    columns:
      - name: player_id
        description: Player the standing belongs to.
        data_tests:
          - not_null
          - relationships:
              arguments: { to: ref('dim_players'), field: player_id }
      - name: title_id
        description: Title the leaderboard belongs to.
        data_tests:
          - relationships:
              arguments: { to: ref('dim_titles'), field: title_id }
      - name: leaderboard_id
        description: Leaderboard the standing is on.
        data_tests: [not_null]
      - name: best_score
        description: Player's highest legitimate (non-flagged) score on the leaderboard.
      - name: legit_submissions
        description: Count of the player's legitimate submissions to the leaderboard.
      - name: flagged_submissions
        description: Count of the player's cheat-flagged submissions, excluded from ranking.
      - name: rank_in_leaderboard
        description: Rank of the player's best score within the leaderboard (1 = top), legit only.
      - name: leaderboard_player_count
        description: Number of ranked (legit) players on the leaderboard — the ranking denominator.
      - name: percentile_in_leaderboard
        description: Percentile of the player's best score within the leaderboard (0-1).
      - name: percentile_global
        description: Percentile of the player's best score across all leaderboards (0-1).
